name: Refresh Events Cache

on:
  workflow_dispatch:
  schedule:
    - cron: '0 9 * * 1'

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Refresh cache file
        env:
          PARSE_API_KEY: ${{ secrets.PARSE_API_KEY }}
          PARSE_SCRAPER_ID: 5a81d537-afb2-4a08-bb42-7f097e69f0d0
        run: node scripts/refresh-events-cache.mjs

      - name: Commit and push changes
        run: |
          if git diff --quiet; then
            echo "No updates to commit."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/events-cache.json
          git commit -m "chore: refresh shared meetup events cache"
          git push
